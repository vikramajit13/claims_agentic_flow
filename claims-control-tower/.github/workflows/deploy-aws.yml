name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: Deploy API to ECS
        required: true
        type: boolean
        default: true
      deploy_web:
        description: Deploy web app to S3/CloudFront
        required: true
        type: boolean
        default: true
      ref:
        description: Git ref to deploy
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
  FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  validate-config:
    name: Validate Deployment Config
    runs-on: ubuntu-latest
    steps:
      - name: Check required variables
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.AWS_ROLE_ARN }}" ]]; then
            echo "Missing secret: AWS_ROLE_ARN"
            exit 1
          fi
          if [[ "${{ inputs.deploy_api }}" == "true" ]]; then
            for value in "$AWS_REGION" "$ECR_REPOSITORY" "$ECS_CLUSTER" "$ECS_SERVICE" "$ECS_TASK_DEFINITION" "$ECS_CONTAINER_NAME"; do
              if [[ -z "$value" ]]; then
                echo "Missing one or more required API deployment variables."
                exit 1
              fi
            done
          fi
          if [[ "${{ inputs.deploy_web }}" == "true" ]]; then
            if [[ -z "$AWS_REGION" || -z "$FRONTEND_S3_BUCKET" || -z "${{ vars.VITE_API_BASE_URL }}" ]]; then
              echo "Missing one or more required web deployment variables, including VITE_API_BASE_URL."
              exit 1
            fi
          fi

  deploy-api:
    name: Deploy API
    needs: validate-config
    if: ${{ inputs.deploy_api }}
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: claims-control-tower/apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            > task-definition-full.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition-full.json > task-definition.json

      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: claims-control-tower/apps/api/task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

  deploy-web:
    name: Deploy Web
    needs: validate-config
    if: ${{ inputs.deploy_web }}
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: claims-control-tower/apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: claims-control-tower/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SSE_URL: ${{ vars.VITE_SSE_URL }}
          VITE_WEBSOCKET_URL: ${{ vars.VITE_WEBSOCKET_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Sync static files to S3
        run: aws s3 sync dist/ "s3://${FRONTEND_S3_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: >
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID"
          --paths "/*"
