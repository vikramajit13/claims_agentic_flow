name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive claims-control-tower/infra

      - name: Terraform init bootstrap
        working-directory: claims-control-tower/infra/bootstrap
        run: terraform init -backend=false

      - name: Terraform validate bootstrap
        working-directory: claims-control-tower/infra/bootstrap
        run: terraform validate

      - name: Terraform init dev
        working-directory: claims-control-tower/infra/environments/dev
        run: terraform init -backend=false

      - name: Terraform validate dev
        working-directory: claims-control-tower/infra/environments/dev
        run: terraform validate

  api:
    name: API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: claims-control-tower/apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('claims-control-tower/apps/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install API dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          USE_MOCK_S3: "true"
          USE_MOCK_OCR: "true"
        run: pytest -q tests

  web:
    name: Web Build And E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: claims-control-tower/package-lock.json

      - name: Install workspace dependencies
        working-directory: claims-control-tower
        run: npm ci

      - name: Build web app
        working-directory: claims-control-tower
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npm run web:build

      - name: Install Playwright Chromium
        working-directory: claims-control-tower/apps/web
        run: npx playwright install --with-deps chromium

      - name: Run web end-to-end tests
        working-directory: claims-control-tower
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npm run web:test:e2e
