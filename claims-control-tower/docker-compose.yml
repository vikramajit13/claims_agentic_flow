services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: claims-control-tower-postgres
    environment:
      POSTGRES_DB: claims_control_tower
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: claims-control-tower-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://claims:claims@postgres:5432/claims_control_tower
      USE_MOCK_S3: "true"
      USE_MOCK_OCR: "true"
      USE_MOCK_SQS: "true"
      DEFAULT_HITL_REQUIRED: ${DEFAULT_HITL_REQUIRED:-false}
      ENABLE_LLM_DOCUMENT_INTELLIGENCE: ${ENABLE_LLM_DOCUMENT_INTELLIGENCE:-false}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DOCUMENT_INTELLIGENCE_MODEL: ${DOCUMENT_INTELLIGENCE_MODEL:-llama3.1:8b}
      ALLOW_KEYLESS_LOCAL_LLM: ${ALLOW_KEYLESS_LOCAL_LLM:-true}
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
