name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: Deploy API to ECS
        required: true
        type: boolean
        default: true
      deploy_web:
        description: Deploy web app to S3/CloudFront
        required: true
        type: boolean
        default: true
      deploy_infra:
        description: Apply Terraform dev infrastructure before deploying app workloads
        required: true
        type: boolean
        default: false
      ref:
        description: Git ref to deploy
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-config:
    name: Validate Deployment Config
    runs-on: ubuntu-latest
    steps:
      - name: Check required variables
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.AWS_ROLE_ARN }}" ]]; then
            echo "Missing secret: AWS_ROLE_ARN"
            exit 1
          fi
          if [[ "${{ inputs.deploy_infra }}" == "true" ]]; then
            if [[ -z "${{ vars.TF_VAR_DATABASE_URL_SECRET_ARN }}" || -z "${{ vars.TF_VAR_INTERNAL_SERVICE_TOKEN_SECRET_ARN }}" ]]; then
              echo "Missing required Terraform variables for infra apply."
              echo "Expected repo variables: TF_VAR_DATABASE_URL_SECRET_ARN and TF_VAR_INTERNAL_SERVICE_TOKEN_SECRET_ARN"
              exit 1
            fi
          fi

  terraform-dev:
    name: Terraform Dev Outputs
    needs: validate-config
    runs-on: ubuntu-latest
    outputs:
      aws_region: ${{ steps.capture.outputs.aws_region }}
      ecr_repository: ${{ steps.capture.outputs.ecr_repository }}
      ecs_cluster: ${{ steps.capture.outputs.ecs_cluster }}
      ecs_service: ${{ steps.capture.outputs.ecs_service }}
      ecs_task_definition: ${{ steps.capture.outputs.ecs_task_definition }}
      ecs_container_name: ${{ steps.capture.outputs.ecs_container_name }}
      frontend_bucket: ${{ steps.capture.outputs.frontend_bucket }}
      cloudfront_distribution_id: ${{ steps.capture.outputs.cloudfront_distribution_id }}
      api_base_url: ${{ steps.capture.outputs.api_base_url }}
      s3_event_lambda_name: ${{ steps.capture.outputs.s3_event_lambda_name }}
      ocr_queue_lambda_name: ${{ steps.capture.outputs.ocr_queue_lambda_name }}
    defaults:
      run:
        working-directory: claims-control-tower/infra/environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-2
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        if: ${{ inputs.deploy_infra }}
        env:
          TF_VAR_database_url_secret_arn: ${{ vars.TF_VAR_DATABASE_URL_SECRET_ARN }}
          TF_VAR_internal_service_token_secret_arn: ${{ vars.TF_VAR_INTERNAL_SERVICE_TOKEN_SECRET_ARN }}
          TF_VAR_langsmith_api_key_secret_arn: ${{ vars.TF_VAR_LANGSMITH_API_KEY_SECRET_ARN }}
        run: terraform apply -auto-approve -input=false

      - name: Capture Terraform outputs
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          terraform output -json > tf-outputs.json

          output() {
            local key="$1"
            jq -r --arg key "$key" '.[$key].value' tf-outputs.json
          }

          {
            echo "aws_region=$(output aws_region)"
            echo "ecr_repository=$(output ecr_repository)"
            echo "ecs_cluster=$(output ecs_cluster)"
            echo "ecs_service=$(output ecs_service)"
            echo "ecs_task_definition=$(output ecs_task_definition_family)"
            echo "ecs_container_name=$(output ecs_container_name)"
            echo "frontend_bucket=$(output frontend_bucket)"
            echo "cloudfront_distribution_id=$(output cloudfront_distribution_id)"
            echo "api_base_url=$(output api_base_url)"
            echo "s3_event_lambda_name=$(output s3_event_lambda_name)"
            echo "ocr_queue_lambda_name=$(output ocr_queue_lambda_name)"
          } >> "$GITHUB_OUTPUT"

  deploy-api:
    name: Deploy API
    needs: terraform-dev
    if: ${{ inputs.deploy_api }}
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: claims-control-tower/apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.terraform-dev.outputs.aws_region }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ needs.terraform-dev.outputs.ecs_task_definition }}" \
            --query taskDefinition \
            > task-definition-full.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition-full.json > task-definition.json

      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ needs.terraform-dev.outputs.ecs_container_name }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: ${{ needs.terraform-dev.outputs.ecs_cluster }}
          service: ${{ needs.terraform-dev.outputs.ecs_service }}
          wait-for-service-stability: true

  deploy-web:
    name: Deploy Web
    needs: terraform-dev
    if: ${{ inputs.deploy_web }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: claims-control-tower/package-lock.json

      - name: Install web dependencies
        working-directory: claims-control-tower
        run: npm ci

      - name: Build web app
        working-directory: claims-control-tower
        env:
          VITE_API_BASE_URL: ${{ needs.terraform-dev.outputs.api_base_url }}
          VITE_SSE_URL: ${{ vars.VITE_SSE_URL }}
          VITE_WEBSOCKET_URL: ${{ vars.VITE_WEBSOCKET_URL }}
        run: npm run web:build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ needs.terraform-dev.outputs.aws_region }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Sync static files to S3
        working-directory: claims-control-tower/apps/web
        run: aws s3 sync dist/ "s3://${{ needs.terraform-dev.outputs.frontend_bucket }}" --delete

      - name: Invalidate CloudFront cache
        if: ${{ needs.terraform-dev.outputs.cloudfront_distribution_id != '' }}
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ needs.terraform-dev.outputs.cloudfront_distribution_id }}"
          --paths "/*"
