name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: claims-control-tower/apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('claims-control-tower/apps/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install API dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          USE_MOCK_S3: "true"
          USE_MOCK_OCR: "true"
        run: pytest -q tests

  web:
    name: Web Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: claims-control-tower/apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: claims-control-tower/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
